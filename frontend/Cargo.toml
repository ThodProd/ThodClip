[package]
name = "thodclip-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Document", "Node", "NodeList", "Element", "HtmlElement", "HtmlInputElement", "HtmlImageElement", "HtmlButtonElement", "DomTokenList", "DomStringMap", "Storage", "KeyboardEvent", "Event", "EventTarget", "Location", "MessageEvent", "console", "Crypto", "HtmlCollection", "CssStyleDeclaration", "UrlSearchParams", "MediaQueryList", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "HtmlDocument"] }
